# Account surfaces always bypass inherited proxy caches, including plugin account APIs.
# This file is included inside nginx's http context (the map is shared by both servers).
map $uri $jf_private_account {
    default 0;
    ~*^/(account|platform-account|api/(account|platform-account))(/|$) 1;
    ~*^/(ext|api)/[^/]+/account(/|$) 1;
}

# Justflows — production Nginx configuration
# Place in /etc/nginx/sites-available/justflows and symlink to sites-enabled/
#
# Two things in here are easy to get wrong and are called out where they appear:
#
#  1. `add_header` does not inherit into a `location` that declares its own. Any
#     block with its own add_header must repeat the whole security set, or it
#     silently serves without one.
#  2. Without `always`, a header is skipped on 4xx and 5xx responses — including
#     the error pages an attacker is most likely to be looking at.

server {
    listen 80;
    server_name _;

    # Uncomment once TLS is in place. Justflows sets Secure on its session
    # cookie whenever APP_URL is https, so serving the admin over plain HTTP is
    # only ever a staging arrangement.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for APPENDS the real peer to any client-supplied
        # value. Express is configured with `trust proxy=loopback`, so it walks
        # the list from this end and lands on the appended address — a client
        # sending its own X-Forwarded-For cannot spoof req.ip. Replacing this
        # with $http_x_forwarded_for would break that, and with it both per-IP
        # rate limiting and the install token's loopback exemption.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade $jf_private_account;
        proxy_no_cache $jf_private_account;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploads are visitor-supplied files. Serving them straight off disk is
    # faster, but it bypasses the Content-Disposition the app attaches to PDFs —
    # a PDF rendered inline runs its own scripting in this origin. The header is
    # repeated here because this block declares its own.
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # 0, not "1; mode=block": the legacy filter introduced vulnerabilities of
    # its own, and this matches what Justflows sends from Admin → Security.
    add_header X-XSS-Protection 0 always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 110m;
}

server {
    listen 443 ssl;
    # nginx 1.25.1+. On older builds use: listen 443 ssl http2;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/justflows.crt;
    ssl_certificate_key /etc/ssl/private/justflows.key;

    # Mozilla "intermediate", Feb 2025. TLS 1.3 needs no cipher list.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JustflowsSSL:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # See the note in the port-80 block — appending, not replacing.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade $jf_private_account;
        proxy_no_cache $jf_private_account;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection 0 always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 110m;
}
